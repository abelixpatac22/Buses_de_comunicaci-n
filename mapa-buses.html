<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buses de Comunicación — Mapa Conceptual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#0e1311;--grid:#ffffff0d;--panel:#141b18;--line:#2a3631;--tx:#e8efec;--mut:#8fa39a;--c0:#cbd5d1;--c1:#a5b4fc;--c2:#5eead4;--c3:#fb923c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1311}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f7f5;--grid:#0000000d;--panel:#fff;--line:#c9d6d0;--tx:#16201c;--mut:#5a6d64;--c0:#475569;--c1:#4338ca;--c2:#0f766e;--c3:#c2410c}}
:root[data-theme="light"]{--bg:#f4f7f5;--grid:#0000000d;--panel:#fff;--line:#c9d6d0;--tx:#16201c;--mut:#5a6d64;--c0:#475569;--c1:#4338ca;--c2:#0f766e;--c3:#c2410c}
:root[data-theme="dark"]{--bg:#0e1311}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--mut)}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(30px,6vw,52px);margin:6px 0 22px;line-height:1.1;padding-bottom:18px;border-bottom:1px solid var(--line)}
h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0 0 6px}
h2 span{font-family:'IBM Plex Mono',monospace;color:var(--c2);font-size:15px;margin-right:10px}
.hint{color:var(--mut);margin:0 0 14px;font-size:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--panel);border-radius:6px}
svg{display:block;min-width:720px;width:100%;height:auto}
.hd rect,.rt rect{fill:var(--k);fill-opacity:.25;stroke:var(--k);stroke-width:1.2}
.hd text,.rt text{fill:var(--k);font:600 15px 'IBM Plex Sans',sans-serif;text-anchor:middle;pointer-events:none}
.it rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2;transition:.15s}
.it .a{fill:var(--tx);font:600 14px 'IBM Plex Sans',sans-serif;text-anchor:middle;pointer-events:none}
.it .b{fill:var(--mut);font:12px 'IBM Plex Sans',sans-serif;text-anchor:middle;pointer-events:none}
.n{cursor:pointer;outline:none}
.n:hover rect,.n:focus rect,.n.on rect{stroke:var(--k);stroke-width:2.2}
.it.on rect{fill:var(--k);fill-opacity:.14}
.ln{fill:none;stroke:var(--mut);stroke-width:1.4}
.lb{fill:var(--mut);font:12px 'IBM Plex Sans',sans-serif}
.info{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin:0 0 26px;box-shadow:0 6px 20px #0006;border:1px solid var(--line);border-left:3px solid var(--k,var(--c2));background:var(--panel);padding:16px 20px;border-radius:4px}
.info h3{font-family:Fraunces,Georgia,serif;margin:4px 0 8px;font-size:22px}
.info p{margin:0 0 8px}
.sub{font-size:14px;margin:4px 0;padding-left:10px;border-left:2px solid var(--line)}
.sub b{color:var(--k)}
.tag{display:inline-block;border:1px solid var(--line);padding:2px 9px;margin:4px 6px 0 0;font:12px 'IBM Plex Mono',monospace;color:var(--k,var(--c2));border-radius:3px}
footer{margin-top:40px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="mono">Mapa Conceptual · Arquitectura de Computadoras</div>
<h1>Buses de Comunicación</h1>

<h2><span>01</span>Detalle</h2>
<div class="info" id="info"></div>

<h2><span>02</span>Buses de comunicación mapa conceptual</h2>
<p class="hint">Haz clic en cualquier concepto y su explicación aparece arriba.</p>
<div class="scroll"><svg id="map" viewBox="0 0 900 500" role="img" aria-label="Mapa conceptual de buses de comunicación"></svg></div>

<footer>Por Juan Abel Ixpatac Sis</footer>
</div>
<script>
const COLS=[
{t:'¿Qué son?',lab:'se define como',k:'var(--c1)',L:30,items:[
['Líneas eléctricas','conectan componentes','Un bus es un conjunto de cables o líneas eléctricas que conectan los componentes de un sistema.'],
['Canal compartido','datos y señales','Varios dispositivos usan el mismo camino para comunicarse, en lugar de tener un cable directo entre cada par. Eso lo hace más simple y barato.',,['más simple','más barato']],
['Une el sistema','CPU, memoria y E/S','Conecta los componentes principales del sistema: CPU, memoria y entrada/salida.']]},
{t:'¿Para qué sirven?',lab:'cumple la función de',k:'var(--c2)',L:320,items:[
['Transferir datos','entre componentes','Mover información de un lugar a otro, por ejemplo, de la memoria a la CPU.'],
['Direccionar','ubicar memoria o E/S','Indicar dónde se va a leer o guardar algo, como la dirección de una casa.'],
['Controlar','sincronizar acciones','Enviar señales que ordenan y sincronizan las acciones: “lee”, “escribe”, “espera”.'],
['Expandir','añadir dispositivos','Permitir conectar nuevos dispositivos sin rediseñar todo el sistema.']]},
{t:'Tipos de buses',lab:'se clasifican en',k:'var(--c3)',L:610,items:[
['Por función','3 buses básicos','Es la clasificación más básica y tiene tres buses.',[['Bus de datos','lleva la información; va en ambos sentidos.'],['Bus de direcciones','dice a dónde ir; va en un solo sentido, desde la CPU.'],['Bus de control','envía órdenes y señales de coordinación.']]],
['Por ubicación','interno y externo','Distingue dónde se encuentra el bus dentro del equipo.',[['Bus interno','dentro del procesador.'],['Bus del sistema (externo)','conecta CPU, memoria y entrada/salida.'],['Bus de expansión','para tarjetas y periféricos.']]],
['Por transmisión','paralelo o serie','Según cómo viajan los bits por las líneas.',[['Bus paralelo','envía varios bits a la vez, como una autopista de muchos carriles.'],['Bus serie','envía un bit a la vez, pero a velocidades tan altas que hoy suele ser más rápido y confiable. Ej.: USB, SATA y PCIe.']]],
['Por aplicación','PC, micro, automotriz','Según el ámbito en que se usa el bus.',[['Computadoras','USB, PCIe, SATA.'],['Electrónica y microcontroladores','I2C, SPI, UART.'],['Automóviles e industria','CAN, Modbus.']]]]}
];
const D={root:{t:'Buses de comunicación',k:'var(--c0)',d:'Conjunto de cables o líneas eléctricas que conectan los componentes de un sistema mediante un canal compartido.'}};
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');let sel='root';
COLS.forEach((c,ci)=>{D['h'+ci]={t:c.t,k:c.k,d:['Un bus conecta los componentes de un sistema usando un canal compartido.','Los buses cumplen cuatro funciones principales dentro de un sistema.','Los buses pueden clasificarse de cuatro formas distintas.'][ci]};
c.items.forEach((it,i)=>D[ci+'_'+i]={t:it[0],k:c.k,d:it[2],kids:it[3],tg:it[4]})});
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function nd(key,cls,x,y,w,h,a,b){const g=el('g',{class:'n '+cls+(sel===key?' on':''),tabindex:0,role:'button','aria-label':a,style:'--k:'+D[key].k});
el('rect',{x,y,width:w,height:h,rx:8},g);
if(b){el('text',{class:'a',x:x+w/2,y:y+24},g).textContent=a;el('text',{class:'b',x:x+w/2,y:y+43},g).textContent=b}
else el('text',{x:x+w/2,y:y+h/2+5},g).textContent=a;
const go=()=>{sel=key;draw();show()};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}}
function draw(){svg.innerHTML='';
const df=el('defs',{}),m=el('marker',{id:'ar',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},df);
el('path',{d:'M1 1L9 5L1 9',fill:'none',stroke:'var(--mut)','stroke-width':1.5},m);
el('path',{class:'ln',d:'M450 66V96'});el('path',{class:'ln',d:'M160 96H740'});
COLS.forEach((c,ci)=>{const cx=c.L+130;
el('path',{class:'ln',d:`M${cx} 96V124`,'marker-end':'url(#ar)'});
el('text',{class:'lb',x:cx+10,y:116},svg).textContent=c.lab;
nd('h'+ci,'hd',c.L,126,260,44,c.t);
const last=200+(c.items.length-1)*72+29;
el('path',{class:'ln',d:`M${c.L+12} 170V${last}`});
c.items.forEach((it,i)=>{const y=200+i*72;
el('path',{class:'ln',d:`M${c.L+12} ${y+29}H${c.L+34}`,'marker-end':'url(#ar)'});
nd(ci+'_'+i,'it',c.L+36,y,224,58,it[0],it[1])})});
nd('root','rt',335,20,230,46,'Buses de comunicación')}
function show(){const n=D[sel],i=document.getElementById('info');i.style.setProperty('--k',n.k);
i.innerHTML=`<div class="mono">Concepto</div><h3>${n.t}</h3><p>${n.d}</p>`+(n.kids||[]).map(k=>`<div class="sub"><b>${k[0]}</b> — ${k[1]}</div>`).join('')+(n.tg||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
draw();show();
</script>
</body>
</html>
